version: '2'

volumes:
    uploads:
        driver: local
  
services:
    sqlscript:
        build:
            context: database/
            dockerfile: Dockerfile
    php:
        build:
            context: .
            dockerfile: Dockerfile
        links:
            - mysql
        ports:
            - "80:80"
        volumes:
            - uploads:/app/public/uploads
        environment:
            - FORCE_HTTPS=false
            - PHP_TIMEZONE=UTC
            - MYSQL_USERNAME=root
            - MYSQL_PASSWORD=${MYSQL_PASSWORD:-changeme}
            - MYSQL_DB_NAME=ospos
            - MYSQL_HOST_NAME=mysql

    mysql:
        image: mariadb:10.1.21
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-changeme}
            - MYSQL_DATABASE=ospos
            - MYSQL_USER=root
            - MYSQL_PASSWORD=${MYSQL_PASSWORD:-changeme}
        ports:
            - "3306:3306"
        volumes_from:
            - sqlscript
